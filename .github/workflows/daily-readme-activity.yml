name: Daily README activity

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update activity marker
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          marker = f"<!-- daily-readme-activity: {datetime.now(timezone.utc):%Y-%m-%d} -->"
          updated, count = re.subn(
              r"<!-- daily-readme-activity: \d{4}-\d{2}-\d{2} -->",
              marker,
              content,
              count=1,
          )
          if count == 0:
              separator = "" if content.endswith("\n") else "\n"
              updated = f"{content}{separator}\n{marker}\n"
          readme.write_text(updated, encoding="utf-8")

      - name: Commit README change
        shell: bash
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git add README.md
          git commit -m "chore: update daily README activity"
          git push
